<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#1f2a24;font-family:'Noto Sans CJK JP','Noto Sans JP',sans-serif;color:#fff;position:relative;overflow:hidden}
.tag{position:absolute;top:258px;left:60px;background:#f6d77a;color:#1f2a24;font-weight:900;font-size:34px;padding:8px 22px;border-radius:40px}
h1{position:absolute;top:330px;left:60px;right:60px;font-size:72px;line-height:1.3;font-weight:900}
h1 em{font-style:normal;color:#f6d77a}
.panel{position:absolute;top:530px;left:30px;width:1020px;border-radius:24px;overflow:hidden;background:#f5f2ec}
.panel img{width:100%;display:block}
.steps{position:absolute;top:1100px;left:60px;right:60px}
.st{display:flex;align-items:flex-start;gap:24px;margin-bottom:22px}
.n{flex:none;width:92px;height:92px;border-radius:50%;background:#f6d77a;color:#1f2a24;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.t{font-size:46px;font-weight:800;line-height:1.35;padding-top:12px}
.t small{display:block;font-size:32px;font-weight:600;color:#d9e3dc;margin-top:6px}
.save{position:absolute;top:1462px;left:60px;right:60px;text-align:center;font-size:40px;font-weight:800;border:3px solid #f6d77a;border-radius:20px;padding:22px 10px;color:#f6d77a}
</style></head><body>
<div class="tag">今日のポイント｜プードルの顔</div>
<h1>テディベアの顔、<br>ハサミは<em>場所で2種類</em></h1>
<div class="panel"><img src="panel.png"></div>
<div class="steps">
<div class="st"><div class="n">01</div><div class="t">頭＝カーブチャンカー<br>目周り・ストップ＝カーブ</div></div>
<div class="st"><div class="n">02</div><div class="t">輪郭サイド・顎下サイド・顎下<br>＝チャンカー<small>刈った後、出ている毛だけを揃える</small></div></div>
</div>
<div class="save">保存して、次のカットの前に見返してね</div>
</body></html>
