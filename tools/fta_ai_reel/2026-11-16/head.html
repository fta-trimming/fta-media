<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Noto Sans CJK JP',sans-serif;background:#fff;color:#333}
.sc{position:absolute;inset:0;opacity:0;background:#fff}
.bar{position:absolute;top:70px;left:90px;right:90px;height:10px;background:#e8f2ec;border-radius:5px;z-index:9}
.bar i{display:block;height:100%;background:#3d6b4f;border-radius:5px;width:0}
.num{position:absolute;top:100px;left:90px;font-size:34px;font-weight:700;color:#3d6b4f;letter-spacing:2px;z-index:9}
.brand{position:absolute;top:100px;right:90px;font-size:26px;color:#6b6b6b;letter-spacing:3px;z-index:9}
.ln{opacity:0;transform:translateY(30px)}
.tag{display:inline-block;background:#3d6b4f;color:#fff;font-size:40px;font-weight:700;padding:10px 30px;border-radius:40px}
h1{font-size:92px;line-height:1.3;font-weight:900;color:#24402f}
h2{font-size:76px;line-height:1.35;font-weight:900;color:#24402f}
h3{font-size:58px;line-height:1.45;font-weight:700;color:#333}
.g{color:#3d6b4f}.y{background:linear-gradient(transparent 62%,#f6d77a 62%)}.o{color:#c8700a}
.box{position:absolute;left:90px;right:90px}
.note{font-size:30px;color:#6b6b6b}
.sc.dark{background:#24402f}.dark h1,.dark h2,.dark h3{color:#fff}.dark .g{color:#f6d77a}.dark .note{color:#9bb8a6}
.chk{display:flex;align-items:center;gap:30px;background:#e8f2ec;border-radius:24px;padding:36px 40px;font-size:54px;font-weight:700;color:#24402f;line-height:1.35}
.chk b{flex:0 0 90px;height:90px;border-radius:50%;background:#3d6b4f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:52px}
.credit{position:absolute;bottom:60px;left:60px;font-size:24px;color:#9bb8a6}
.save{text-align:center;color:#fff;font-size:52px;font-weight:900}
</style></head><body>
<div class="bar"><i id="pb"></i></div><div class="num" id="num">01 / 07</div><div class="brand" id="brand">FUJIWARA TRIMMING ACADEMY</div>
