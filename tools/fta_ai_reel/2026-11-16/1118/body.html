<script>
const NS='http://www.w3.org/2000/svg';
const h2g=document.getElementById('hair2');for(let k=0;k<14;k++){const p=document.createElementNS(NS,'path');const x=70+k*56;p.setAttribute('d',`M${x} 200 q 20 120 -10 260`);p.dataset.x=x;h2g.appendChild(p)}
const tg=document.getElementById('teeth2');for(let k=0;k<12;k++){const r=document.createElementNS(NS,'rect');r.setAttribute('x',14+k*24);r.setAttribute('y',50);r.setAttribute('width',12);r.setAttribute('height',90);r.setAttribute('rx',5);tg.appendChild(r)}
const h3=document.getElementById('hair3');for(let k=0;k<16;k++){const l=document.createElementNS(NS,'line');const x=110+k*45;if(Math.abs(x-560)<20)continue;l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',170);l.setAttribute('y2',400);h3.appendChild(l)}
function anim(i,lt,dur){
 if(i==0){document.getElementById('zone1').setAttribute('opacity',0.25+0.35*(Math.sin(lt*4)+1)/2)}
 if(i==1){const p=Math.min(1,Math.max(0,(lt-1.2)/3));const cy=180+300*p;document.getElementById('comb2').setAttribute('transform',`translate(${200},${cy-200})`);
   [...h2g.children].forEach(e=>{const x=+e.dataset.x;const inC=x>200&&x<500;const stuck=(Math.abs(x-294)<10||Math.abs(x-406)<10);e.setAttribute('stroke',inC&&!stuck&&p>0?'#3d6b4f':'#9bb8a6');e.setAttribute('d',inC&&!stuck?`M${x} 200 L ${x} 460`:`M${x} 200 q 20 120 -10 260`)})}
 if(i==2){const p=ease((lt-2.2)/0.6);document.getElementById('pop3').setAttribute('y2',170+300*p);document.getElementById('pop3').setAttribute('x2',560+70*p);const r=document.getElementById('ring3');r.setAttribute('opacity',p*(0.6+0.4*Math.sin(lt*5)));r.setAttribute('cx',625);r.setAttribute('cy',460)}
 if(i==3){document.getElementById('arr4').setAttribute('transform',`translate(0,${10*Math.sin(lt*4)})`)}
 if(i==4){document.getElementById('down5').setAttribute('transform',`translate(0,${6*Math.sin(lt*4)})`);document.getElementById('ck5').setAttribute('stroke-dashoffset',80*(1-ease((lt-2.5)/0.8)))}
}
</script>
