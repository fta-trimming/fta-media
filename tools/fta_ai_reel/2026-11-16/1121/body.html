<script>
const NS='http://www.w3.org/2000/svg';const LB=['知る','気になる','確かめる','予約する'];
// stairs: 4 steps, each w=180, rise=110 ; labels on top
function stairs(id,{labels=true,dark=false,big=false}={}){const g=document.getElementById(id);g.innerHTML='';const W=190,H=150;
 for(let k=0;k<4;k++){const r=document.createElementNS(NS,'rect');r.setAttribute('x',20+k*W);r.setAttribute('y',700-(k+1)*H);r.setAttribute('width',W-10);r.setAttribute('height',(k+1)*H);r.setAttribute('rx',14);r.setAttribute('fill',dark?'#3d6b4f':'#cfe3d6');r.id=id+'_'+k;g.appendChild(r);
  if(labels){const t=document.createElementNS(NS,'text');t.setAttribute('x',20+k*W+(W-10)/2);t.setAttribute('y',700-(k+1)*H+70);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',k==1||k==3?38:44);t.setAttribute('font-weight','900');t.setAttribute('font-family','Noto Sans CJK JP');t.setAttribute('fill',dark?'#fff':'#24402f');t.textContent=LB[k];t.id=id+'_t'+k;g.appendChild(t)}}
 const m=document.createElementNS(NS,'g');m.id=id+'_m';m.innerHTML='<circle r="46" fill="none" stroke="#c8700a" stroke-width="12"/><text y="18" text-anchor="middle" font-size="56" font-weight="900" fill="#c8700a">!</text>';m.setAttribute('opacity',0);g.appendChild(m)}
function mark(id,k,o,col){const m=document.getElementById(id+'_m');const W=190,H=150;m.setAttribute('transform',`translate(${20+k*W+90},${700-(k+1)*H-70})`);m.setAttribute('opacity',o);document.getElementById(id+'_'+k).setAttribute('fill',col||'#fbe7cf')}
stairs('st1',{labels:false,dark:true});stairs('st2');stairs('st3a',{labels:false});stairs('st3b',{labels:false});stairs('st3c',{labels:false});stairs('st4');stairs('st5');stairs('st7',{labels:false,dark:true});

document.getElementById('st7').setAttribute('transform','translate(0,-200)');
function anim(i,lt,dur){
 if(i==0){mark('st1',2,ease((lt-1.6)/0.6)*(0.7+0.3*Math.sin(lt*5)))}
 if(i==1){for(let k=0;k<4;k++){const p=ease((lt-1.3-k*0.75)/0.4);document.getElementById('st2_'+k).setAttribute('opacity',0.15+0.85*p);document.getElementById('st2_t'+k).setAttribute('opacity',p)}}
 if(i==2){const p=ease((lt-1.5)/0.5);mark('st3a',0,p);mark('st3b',1,ease((lt-2.1)/0.5));mark('st3c',3,ease((lt-2.7)/0.5))}
 if(i==3){mark('st4',2,ease((lt-2.6)/0.5)*(0.75+0.25*Math.sin(lt*5)))}
 if(i==4){const p=ease((lt-3.2)/0.8);mark('st5',2,1-p,p>0.5?'#3d6b4f':'#fbe7cf');if(p>0.5)document.getElementById('st5_t2').setAttribute('fill','#fff')}
 if(i==6){mark('st7',2,0,'#f6d77a')}
}
</script>
