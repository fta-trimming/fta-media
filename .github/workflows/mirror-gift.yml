name: mirror to gift branch (no videos)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: src }
      - uses: actions/checkout@v4
        with: { ref: gift, path: dst }
      - name: copy gift/ and images (no mp4/mov) into gift branch
        run: |
          cd src
          for d in gift cut number shop salon; do
            [ -d "$d" ] || continue
            find "$d" -type f ! -iname '*.mp4' ! -iname '*.mov' ! -iname '*.json' -size -5M -print0 | while IFS= read -r -d '' f; do
              mkdir -p "../dst/$(dirname "$f")"; cp -p "$f" "../dst/$f"
            done
          done
          cd ../dst
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "mirror from main ${GITHUB_SHA::7}" && git push origin gift)
